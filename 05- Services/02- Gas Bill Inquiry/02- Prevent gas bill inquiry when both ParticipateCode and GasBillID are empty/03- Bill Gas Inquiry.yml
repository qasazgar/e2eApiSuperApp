info:
  name: 03- Bill Gas Inquiry
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/bill/gas/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "participate_code": "",
        "gas_bill_id": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 400", () => {
          expect(res.status).to.equal(400);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });


        // ========================================
        // Parse Response
        // ========================================

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }


        // ========================================
        // Missing Gas Bill ID / Participate Code
        // ========================================

        if (
          responseData.data &&
          Array.isArray(responseData.data.non_field_errors) &&
          responseData.data.non_field_errors.includes(
            "Either participate_code or gas_bill_id must be provided."
          )
        ) {
          console.log("❌ کد اشتراک و یا شناسه قبض گاز وجود ندارد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
