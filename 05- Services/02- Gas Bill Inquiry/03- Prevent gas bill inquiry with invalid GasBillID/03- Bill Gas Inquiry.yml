info:
  name: 03- Bill Gas Inquiry
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/bill/gas/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "participate_code": "",
        "gas_bill_id": "{{Invalid_gaz_bill_ID}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });


        // ========================================
        // Parse Response
        // ========================================

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }


        // ========================================
        // Invalid Gas Bill ID
        // ========================================

        if (
          responseData.message === "The bill ID content is incorrect."
        ) {
          console.log("❌ شناسه قبض گاز نامعتبر است");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
