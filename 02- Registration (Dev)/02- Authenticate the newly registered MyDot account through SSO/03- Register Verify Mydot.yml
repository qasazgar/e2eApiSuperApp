info:
  name: 03- Register Verify Mydot
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev-mydot}}auth/register/verify-otp/"
  body:
    type: json
    data: |-
      {
        "phone_number": "{{Generated_phone_number}}",
        "otp": "{{Register_OTP}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        if (responseData.user && responseData.user.id) {
          console.log("✅ کاربر با موفقیت در مادی دات رجیستر شد");
        } else {
          console.log("❌ رجیستر کاربر ناموفق بود");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
