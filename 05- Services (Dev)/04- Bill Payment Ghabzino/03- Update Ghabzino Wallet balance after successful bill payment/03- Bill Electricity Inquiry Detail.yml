info:
  name: 03- Bill Electricity Inquiry Detail
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/bill/electricity/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "electricity_bill_id": "{{Electricity-id}}",
        "mobile_number": "{{Electricity_phone_number}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        if (
          responseData.success === true &&
          responseData.data &&
          responseData.data.is_paid === true
        ) {
          const totalAmount = responseData.data.total_amount;

          bru.setVar("paid_total_amount", totalAmount);

          console.log("💰 مبلغ قبض:", totalAmount);
          console.log("✅ قبض قبلاً پرداخت شده است");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
