docs:
  content: |-
    # **User enters an expired OTP after 2 minutes**

    **Given** the user has requested an OTP \
    **And** the OTP is valid for 2 minutes \
    **And** more than 2 minutes have passed since the OTP was issued \
    **When** the user enters the expired OTP \
    **And** the user submits the OTP \
    **Then** the OTP verification should fail \
    **And** the user should not be authenticated \
    **And** an appropriate error message should be displayed
  type: text/markdown
