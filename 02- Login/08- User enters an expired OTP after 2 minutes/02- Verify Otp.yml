info:
  name: 02- Verify Otp
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url-Dev-mydot}}auth/superapp/login/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {

        "phone_number": "{{phone_number}}",
        "pre_auth_token": "{{pre_auth_token}}",
        "mfa_method": "sms",
        "otp": "{{otp}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log("⏰ لطفا ۲ دقیقه صبر کنید");

        await new Promise(resolve => setTimeout(resolve, 130000));
    - type: after-response
      code: |-
        test("Status code is 401", () => {
          expect(res.status).to.equal(401);
        });

        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

        if (res.status === 401) {
          console.log("❌ کد OTP منقضی شده است");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
