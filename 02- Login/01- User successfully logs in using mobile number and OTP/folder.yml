docs:
  content: |-
    # **User successfully logs in using mobile number and OTP**

    **Given** the user is on the Login page\
    **When** the user enters a valid mobile number \
    **And** the user submits the mobile number \
    **And** the system sends an OTP to the user's mobile number \
    **And** the user enters the valid OTP \
    **And** the user submits the OTP \
    **Then** the user should be successfully authenticated \
    **And** the user should be redirected to the Super App homepage
  type: text/markdown
