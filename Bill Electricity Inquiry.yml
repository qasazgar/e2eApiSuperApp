info:
  name: Bill Electricity Inquiry
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/bill/electricity/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "electricity_bill_id": "{{Electricity-id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 5000ms", () => {
          expect(res.responseTime).to.be.below(5000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
