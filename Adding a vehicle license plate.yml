info:
  name: Adding a vehicle license plate
  type: http
  seq: 21

http:
  method: POST
  url: "{{Url-Dev}}services/financial/vehicles/"
  body:
    type: json
    data: |-
      {
        "title": "پژو207",
        "plate_number": "{{plate_number_car}}",
        "vehicle_type": "car"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const plates = [
          "11/الف/347/21",
          "22/ب/581/32",
          "33/ج/764/43",
          "44/د/219/54",
          "55/س/638/65",
          "66/ص/472/76",
          "77/ط/895/87",
          "88/ظ/326/98",
          "99/ع/751/19",
          "11/ف/483/20",
          "22/ق/917/31",
          "33/ک/245/42",
          "44/گ/683/53",
          "55/ل/129/64",
          "66/م/574/75",
          "77/ن/836/86",
          "88/و/291/97",
          "99/ه/645/18",
          "11/ی/782/29",
          "22/پ/416/30",
          "33/ت/953/41",
          "44/ث/287/52",
          "55/ز/619/63",
          "66/ژ/345/74",
          "77/ش/728/85",
          "88/ع/154/96",
          "99/غ/563/17",
          "11/ک/894/28",
          "22/م/237/39",
          "33/ن/681/40"
        ];

        // دریافت index قبلی
        let index = Number(bru.getVar("plate_index") || 0);

        // بررسی اینکه پلاک باقی مانده باشد
        if (index >= plates.length) {
          throw new Error(
            "تمام 30 پلاک استفاده شده‌اند. پلاک تکراری ارسال نمی‌شود."
          );
        }

        // انتخاب پلاک
        const selectedPlate = plates[index];

        // ذخیره پلاک برای Body
        bru.setVar("plate_number_car", selectedPlate);

        // افزایش index برای Request بعدی
        bru.setVar("plate_index", String(index + 1));

        // Log
        console.log("Selected plate:", selectedPlate);
        console.log("Plate index:", index + 1);
        console.log("Remaining plates:", plates.length - (index + 1));
    - type: after-response
      code: |-
        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            throw new Error(
              "Response is not JSON. Response body: " + data.substring(0, 300)
            );
          }
        }

        if (!data.data || data.data.id === undefined) {
          throw new Error(
            "id not found in response: " + JSON.stringify(data)
          );
        }

        bru.setVar(
          "id_plate_number_car",
          String(data.data.id)
        );

        console.log(
          "id_plate_number_car:",
          data.data.id
        );

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
