info:
  name: 32- Top up wallet
  type: http
  seq: 32

http:
  method: POST
  url: "{{Url-Dev}}payment/payments/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "payment_purpose": "WALLET_TOPUP",
        "origin_service": "wallet",
        "amount": {{wallet_topup_amount}},
        "client_reference": "",
        "payment_method": "GATEWAY"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let currentAmount = bru.getVar("wallet_topup_amount");

        // اگر اولین اجراست، از 10000 شروع کن
        if (!currentAmount) {
          currentAmount = 10000;
        } else {
          currentAmount = Number(currentAmount) + 10000;
        }

        // ذخیره مقدار برای Call بعدی و Run بعدی
        bru.setVar("wallet_topup_amount", currentAmount);

        console.log("💰 Wallet Top Up Amount:", currentAmount);
    - type: after-response
      code: |-
        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        const data = res.body;
        const payment = data.data;

        if (payment && payment.external_payment_id) {
          bru.setVar("external_payment_id", payment.external_payment_id);

          console.log("✅ external payment id با موفقیت ذخیره شد");
          console.log("💳 external payment id:", payment.external_payment_id);
        } else {
          console.log("❌ external payment id در پاسخ وجود ندارد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
