info:
  name: 03- Register Verify
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url-Dev}}account/register/verify-otp/"
  body:
    type: json
    data: |-
      {
        "phone_number": "{{Generated_phone_number}}",
        "otp": "{{Register_OTP}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
