info:
  name: 05- Bill Gas Inquiry
  type: http
  seq: 5

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/bill/gas/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "participate_code": "",
        "gas_bill_id": "{{Gas-id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        if (
          responseData.success === true &&
          responseData.data
        ) {
          bru.setVar(
            "trace_number",
            responseData.data.trace_number
          );

          bru.setVar(
            "total_amount",
            responseData.data.total_amount
          );

          console.log(
            "🔖 Trace Number:",
            responseData.data.trace_number
          );

          console.log(
            "💰 Total Amount:",
            responseData.data.total_amount
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
