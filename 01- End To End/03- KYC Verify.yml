        ];


        // ========================================
        // Get Current Row
        // ========================================

        const index = Number(
          bru.getVar("user_data_index") || 0
        );

        if (index >= users.length) {
          throw new Error("❌ تمام Row ها استفاده شده‌اند.");
        }

        const user = users[index];


        // ========================================
        // Mobile Number
        // ========================================

        let mobileNumber = String(user.cellphone);

        if (!mobileNumber.startsWith("0")) {
          mobileNumber = "0" + mobileNumber;
        }


        // ========================================
        // Gregorian Birth Date
        // ========================================

        const birthdayParts = String(user.birthday).split("-");

        const year = birthdayParts[0];
        const month = birthdayParts[1].padStart(2, "0");
        const day = birthdayParts[2].padStart(2, "0");

        const birthDate = `${year}-${month}-${day}`;


        // ========================================
        // National ID - Always 10 Digits
        // ========================================

        const correctNationalId = String(user.ssn)
          .replace(/\D/g, "")
          .padStart(10, "0");

        let finalNationalId = correctNationalId;


        // ========================================
        // Every 3rd Request → Wrong National ID
        // ========================================

        if ((index + 1) % 3 === 0) {

          const lastDigit = Number(
            correctNationalId.charAt(9)
          );

          const wrongLastDigit = (lastDigit + 1) % 10;

          finalNationalId =
            correctNationalId.substring(0, 9) +
            String(wrongLastDigit);

        }


        // ========================================
        // Set Variables
        // ========================================

        bru.setVar("first_name", user.firstName);
        bru.setVar("last_name", user.lastName);

        bru.setVar(
          "random_national_id",
          finalNationalId
        );

        bru.setVar("mobile_number", mobileNumber);
        bru.setVar("birth_date", birthDate);


        // ========================================
        // Console
        // ========================================

        console.log("========================================");
        console.log("👤 Current Row:", index + 1);
        console.log("👤 First Name:", user.firstName);
        console.log("👤 Last Name:", user.lastName);

        if ((index + 1) % 3 === 0) {
          console.log("❌ Wrong National ID");
        } else {
          console.log("✅ Correct National ID");
        }

        console.log("🆔 National ID:", finalNationalId);
        console.log("📱 Mobile:", mobileNumber);
        console.log("🎂 Birth Date:", birthDate);
        console.log("========================================");
    - type: after-response
      code: |-
        // ========================================
        // Response Time
        // ========================================

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });


        // ========================================
        // Current Row
        // ========================================

        const currentIndex = Number(
          bru.getVar("user_data_index") || 0
        );

        const currentRow = currentIndex + 1;


        // ========================================
        // Parse Response
        // ========================================

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }


        // ========================================
        // KYC SUCCESS
        // ========================================

        if (
          responseData.success === true &&
          responseData.data &&
          responseData.data.status === "success"
        ) {

          console.log("========================================");
          console.log("✅ KYC با موفقیت انجام شد");
          console.log("👤 Row:", currentRow);
          console.log("👤 First Name:", bru.getVar("first_name"));
          console.log("👤 Last Name:", bru.getVar("last_name"));
          console.log("🆔 National ID:", bru.getVar("random_national_id"));
          console.log("📱 Mobile:", bru.getVar("mobile_number"));
          console.log("🎂 Birth Date:", bru.getVar("birth_date"));
          console.log("========================================");

        }


        // ========================================
        // KYC FAILED
        // ========================================

        else if (
          responseData.success === false
        ) {

          console.log("========================================");
          console.log("❌ KYC با موفقیت انجام نشد");
          console.log("👤 Row:", currentRow);
          console.log("👤 First Name:", bru.getVar("first_name"));
          console.log("👤 Last Name:", bru.getVar("last_name"));
          console.log("🆔 National ID:", bru.getVar("random_national_id"));
          console.log("📱 Mobile:", bru.getVar("mobile_number"));
          console.log("🎂 Birth Date:", bru.getVar("birth_date"));
          console.log("📊 HTTP Status:", res.status);
          console.log("📄 Message:", responseData.message);
          console.log("========================================");

        }


        // ========================================
        // UNKNOWN RESPONSE
        // ========================================

        else {

          console.log("========================================");
          console.log("⚠️ پاسخ KYC قابل تشخیص نیست");
          console.log("👤 Row:", currentRow);
          console.log("📊 HTTP Status:", res.status);
          console.log("📄 Response:", res.body);
          console.log("========================================");

        }


        // ========================================
        // MOVE TO NEXT ROW
        // همیشه بعد از هر Response برو Row بعدی
        // ========================================

        bru.setVar(
          "user_data_index",
          String(currentIndex + 1)
        );

        console.log(
          `➡️ Row ${currentRow} processed. Moving to Row ${currentRow + 1}`
        );

