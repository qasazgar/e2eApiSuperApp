info:
  name: 35- Processing the payment
  type: http
  seq: 35

http:
  method: GET
  url: "{{Url-Dev}}payment/payments/{{external_payment_id}}/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
