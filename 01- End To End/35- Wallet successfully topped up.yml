info:
  name: 35- Wallet successfully topped up
  type: http
  seq: 35

http:
  method: GET
  url: "{{Url-Dev}}payment/payments/wallet-balance/{{User_id_wallet}}/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // ========================================
        // Validate Response
        // ========================================

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        // ========================================
        // Get Response Data
        // ========================================

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not valid JSON");
            return;
          }
        }

        // ========================================
        // Get Current Balance
        // ========================================

        const currentBalance = Number(data.data?.balance);

        if (isNaN(currentBalance)) {
          console.log("❌ موجودی کیف پول قابل تشخیص نیست");
          return;
        }

        // ========================================
        // Check Previous Balance
        // ========================================

        const savedBalance = bru.getVar("balance_before_topup");

        // ========================================
        // FIRST CALL - Save Balance Before Top Up
        // ========================================

        if (!savedBalance) {

          bru.setVar(
            "balance_before_topup",
            String(currentBalance)
          );

          console.log("================================");
          console.log("✅ موجودی اولیه دریافت شد");
          console.log("💰 موجودی قبل از شارژ:", currentBalance);
          console.log("💾 موجودی برای مقایسه ذخیره شد");
          console.log("================================");

          return;
        }

        // ========================================
        // SECOND CALL - Validate Top Up
        // ========================================

        const balanceBefore = Number(savedBalance);

        const topupAmount = Number(
          bru.getVar("topup_amount")
        );

        if (isNaN(balanceBefore) || isNaN(topupAmount)) {

          console.log("================================");
          console.log("❌ اطلاعات لازم برای مقایسه موجودی کامل نیست");
          console.log("💰 Balance Before:", balanceBefore);
          console.log("💳 Top Up Amount:", topupAmount);
          console.log("================================");

          return;
        }

        // ========================================
        // Expected Balance
        // ========================================

        const expectedBalance =
          balanceBefore + topupAmount;

        // ========================================
        // Compare
        // ========================================

        if (currentBalance === expectedBalance) {

          console.log("================================");
          console.log(
            `✅ مبلغ ${topupAmount} ریال به کیف پول شما اضافه شد`
          );

          console.log("💰 موجودی قبل:", balanceBefore);
          console.log("💳 مبلغ شارژ:", topupAmount);
          console.log("💰 موجودی بعد:", currentBalance);
          console.log("================================");

        } else {

          console.log("================================");
          console.log(
            `❌ جمع مبلغ کیف پول با ورودی ${topupAmount} ریال مغایرت دارد`
          );

          console.log("💰 موجودی قبل:", balanceBefore);
          console.log("💳 مبلغ شارژ:", topupAmount);
          console.log("📊 موجودی مورد انتظار:", expectedBalance);
          console.log("📊 موجودی واقعی:", currentBalance);
          console.log("================================");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
