          "88/پ/781/72",
          "99/ت/458/83",
          "10/ث/624/94"
        ];

        const index = Number(bru.getVar("plate_index") || 0);

        if (index >= plates.length) {
          throw new Error("❌ تمام ۱۰۰ پلاک بررسی شده‌اند.");
        }

        const selectedPlate = plates[index];

        bru.setVar("plate_number_car", selectedPlate);

        console.log("======================================");
        console.log("🚗 Selected plate:", selectedPlate);
        console.log("🔢 Current index:", index);
        console.log("📊 Plate:", `${index + 1} / ${plates.length}`);
        console.log("======================================");
    - type: after-response
      code: |-
        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not JSON");
            return;
          }
        }

        const index = Number(bru.getVar("plate_index") || 0);
        const selectedPlate = bru.getVar("plate_number_car");

        // ==========================================
        // SUCCESS - Vehicle Created
        // ==========================================

        if (
          res.status === 201 &&
          data.data &&
          data.data.id !== undefined
        ) {

          test("Status code is 201", () => {
            expect(res.status).to.equal(201);
          });

          // ذخیره ID پلاک
          bru.setVar(
            "id_plate_number_car",
            String(data.data.id)
          );

          // رفتن به پلاک بعدی
          bru.setVar(
            "plate_index",
            String(index + 1)
          );

          console.log("✅ Vehicle added successfully");
          console.log("🚗 Plate:", selectedPlate);
          console.log("🆔 ID:", data.data.id);
          console.log("➡️ Next plate index:", index + 1);

          return;
        }


        // ==========================================
        // DUPLICATE - Already Registered
        // ==========================================

        if (
          res.status === 400 &&
          data.message === "This vehicle plate number is already registered."
        ) {

          // چون این پلاک قبلاً ثبت شده،
          // برو سراغ پلاک بعدی
          bru.setVar(
            "plate_index",
            String(index + 1)
          );

          console.log("⚠️ این پلاک قبلاً ثبت شده است");
          console.log("🚗 Plate:", selectedPlate);
          console.log("🔢 Current index:", index);
          console.log("➡️ Next plate index:", index + 1);

          return;
        }


        // ==========================================
        // OTHER ERRORS
        // ==========================================

        console.log("❌ Vehicle was not added");
        console.log("🚗 Plate:", selectedPlate);
        console.log("📊 Status:", res.status);
        console.log("📄 Response:", JSON.stringify(data));
        console.log("⏸️ Index تغییر نکرد");

