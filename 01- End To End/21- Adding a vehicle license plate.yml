info:
  name: 21- Adding a vehicle license plate
  type: http
  seq: 21

http:
  method: POST
  url: "{{Url-Dev}}services/financial/vehicles/"
  body:
    type: json
    data: |-
      {
        "title": "پژو207",
        "plate_number": "{{plate_number_car}}",
        "vehicle_type": "car"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const plates = [
          "12/الف/583/21",
          "23/ب/746/32",
          "34/ج/219/43",
          "45/د/871/54",
          "56/س/394/65",
          "67/ص/628/76",
          "78/ط/145/87",
          "89/ظ/937/98",
          "90/ع/462/19",
          "12/ف/815/20",
          "23/ق/374/31",
          "34/ک/692/42",
          "45/گ/158/53",
          "56/ل/743/64",
          "67/م/286/75",
          "78/ن/951/86",
          "89/و/327/97",
          "90/ه/614/18",
          "12/ی/438/29",
          "23/پ/765/30",
          "34/ت/182/41",
          "45/ث/529/52",
          "56/ز/846/63",
          "67/ژ/213/74",
          "78/ش/674/85",
          "89/ع/395/96",
          "90/غ/728/17",
          "12/ک/561/28",
          "23/م/934/39",
          "34/ن/247/40",
          "45/الف/693/51",
          "56/ب/128/62",
          "67/ج/475/73",
          "78/د/832/84",
          "89/س/316/95",
          "90/ص/759/16",
          "12/ط/284/27",
          "23/ظ/647/38",
          "34/ع/913/49",
          "45/ف/356/50",
          "56/ق/781/61",
          "67/ک/429/72",
          "78/گ/865/83",
          "89/ل/137/94",
          "90/م/592/15",
          "12/ن/824/26",
          "23/و/361/37",
          "34/ه/715/48",
          "45/ی/249/59",
          "56/پ/638/60",
          "67/ت/957/71",
          "78/ث/413/82",
          "89/ز/786/93",
          "90/ژ/152/14",
          "12/ش/549/25",
          "23/ع/873/36",
          "34/غ/264/47",
          "45/ک/691/58",
          "56/م/347/69",
          "67/ن/825/70",
          "78/الف/436/81"
        ];

        let index = Number(bru.getVar("plate_index") || 0);

        if (index >= plates.length) {
          throw new Error("❌ تمام پلاک‌ها بررسی شده‌اند.");
        }

        const selectedPlate = plates[index];

        bru.setVar("plate_number_car", selectedPlate);

        console.log("🚗 Selected plate:", selectedPlate);
        console.log("🔢 Index:", index);
    - type: after-response
      code: |-
        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not JSON");
            return;
          }
        }

        const index = Number(bru.getVar("plate_index") || 0);
        const selectedPlate = bru.getVar("plate_number_car");

        // اگر با موفقیت اضافه شد
        if (
          res.status === 201 &&
          data.data &&
          data.data.id !== undefined
        ) {

          test("Status code is 201", () => {
            expect(res.status).to.equal(201);
          });

          // ذخیره ID پلاک
          bru.setVar(
            "id_plate_number_car",
            String(data.data.id)
          );

          // فقط در صورت موفقیت، برو سراغ پلاک بعدی
          bru.setVar(
            "plate_index",
            String(index + 1)
          );

          console.log("✅ Vehicle added successfully");
          console.log("🚗 Plate:", selectedPlate);
          console.log("🆔 ID:", data.data.id);
          console.log("➡️ Next plate index:", index + 1);

          return;
        }

        // اگر پلاک قبلاً ثبت شده
        if (
          res.status === 400 &&
          data.message === "This vehicle plate number is already registered."
        ) {

          console.log("⚠️ این پلاک قبلاً ثبت شده است");
          console.log("🚗 Plate:", selectedPlate);
          console.log("🔢 Current index:", index);
          console.log("⏸️ Index تغییر نکرد؛ پلاک بعدی انتخاب نمی‌شود");

          return;
        }

        // سایر خطاها
        console.log("❌ Vehicle was not added");
        console.log("🚗 Plate:", selectedPlate);
        console.log("📄 Response:", JSON.stringify(data));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
