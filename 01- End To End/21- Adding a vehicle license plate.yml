info:
  name: 21- Adding a vehicle license plate
  type: http
  seq: 21

http:
  method: POST
  url: "{{Url-Dev}}services/financial/vehicles/"
  body:
    type: json
    data: |-
      {
        "title": "پژو207",
        "plate_number": "{{plate_number_car}}",
        "vehicle_type": "car"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const plates = [
          "11/الف/347/21",
          "22/ب/581/32",
          "33/ج/764/43",
          "44/د/219/54",
          "55/س/638/65",
          "66/ص/472/76",
          "77/ط/895/87",
          "88/ظ/326/98",
          "99/ع/751/19",
          "11/ف/483/20",
          "22/ق/917/31",
          "33/ک/245/42",
          "44/گ/683/53",
          "55/ل/129/64",
          "66/م/574/75",
          "77/ن/836/86",
          "88/و/291/97",
          "99/ه/645/18",
          "11/ی/782/29",
          "22/پ/416/30",
          "33/ت/953/41",
          "44/ث/287/52",
          "55/ز/619/63",
          "66/ژ/345/74",
          "77/ش/728/85",
          "88/ع/154/96",
          "99/غ/563/17",
          "11/ک/894/28",
          "22/م/237/39",
          "33/ن/681/40"
        ];

        let index = Number(bru.getVar("plate_index") || 0);

        if (index >= plates.length) {
          throw new Error("❌ تمام پلاک‌ها بررسی شده‌اند.");
        }

        const selectedPlate = plates[index];

        bru.setVar("plate_number_car", selectedPlate);

        console.log("🚗 Selected plate:", selectedPlate);
        console.log("🔢 Index:", index);
    - type: after-response
      code: |-
        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not JSON");
            return;
          }
        }

        let index = Number(bru.getVar("plate_index") || 0);

        // اگر پلاک قبلاً ثبت شده بود
        if (
          res.status === 400 &&
          data.message === "This vehicle plate number is already registered."
        ) {
          console.log("⚠️ این پلاک قبلاً ثبت شده:");
          console.log("🚗", bru.getVar("plate_number_car"));

          // برو سراغ پلاک بعدی
          bru.setVar("plate_index", String(index + 1));

          console.log("➡️ پلاک بعدی در اجرای بعدی استفاده می‌شود");

          return;
        }

        // اگر با موفقیت ثبت شد
        if (res.status === 201 && data.data && data.data.id !== undefined) {

          test("Status code is 201", () => {
            expect(res.status).to.equal(201);
          });

          bru.setVar(
            "id_plate_number_car",
            String(data.data.id)
          );

          // این پلاک با موفقیت مصرف شد → برو سراغ بعدی
          bru.setVar(
            "plate_index",
            String(index + 1)
          );

          console.log("✅ Vehicle added successfully");
          console.log("🆔 ID:", data.data.id);
          console.log("🚗 Plate:", bru.getVar("plate_number_car"));

          return;
        }

        console.log("❌ Unexpected response:");
        console.log(JSON.stringify(data));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
