info:
  name: 21- Adding a vehicle license plate
  type: http
  seq: 21

http:
  method: POST
  url: "{{Url-Dev}}services/financial/vehicles/"
  body:
    type: json
    data: |-
      {
        "title": "پژو207",
        "plate_number": "{{plate_number_car}}",
        "vehicle_type": "car"
      }
  auth: inherit

