    - type: after-response
      code: |-
        // ========================================
        // Response Time
        // ========================================

        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

        // ========================================
        // Current Plate & Index
        // ========================================

        const currentEditIndex = Number(
          bru.getVar("edit_plate_index") || 0
        );

        const currentPlate = bru.getVar(
          "edit_plate_number_car"
        );

        // ========================================
        // SUCCESS - Status 200
        // ========================================

        if (res.status === 200) {

          test("Status code is 200", () => {
            expect(res.status).to.equal(200);
          });

          bru.setVar(
            "edit_plate_index",
            String(currentEditIndex + 1)
          );

          console.log("================================");
          console.log("✅ Plate updated successfully");
          console.log("🚗 Plate:", currentPlate);
          console.log("🔢 Current index:", currentEditIndex);
          console.log("➡️ Next index:", currentEditIndex + 1);
          console.log("================================");

          return;
        }

        // ========================================
        // DUPLICATE - Status 400
        // ========================================

        if (res.status === 400) {

          let data = res.body;

          if (typeof data === "string") {
            try {
              data = JSON.parse(data);
            } catch (error) {
              data = {};
            }
          }

          if (
            data.message ===
            "This vehicle plate number is already registered."
          ) {

            bru.setVar(
              "edit_plate_index",
              String(currentEditIndex + 1)
            );

            console.log("================================");
            console.log("⚠️ Plate already registered");
            console.log("🚗 Skipped plate:", currentPlate);
            console.log("🔢 Current index:", currentEditIndex);
            console.log("➡️ Next index:", currentEditIndex + 1);
            console.log("================================");

            return;
          }
        }

        // ========================================
        // OTHER ERRORS
        // ========================================

        console.log("================================");
        console.log("❌ Plate update failed");
        console.log("🚗 Plate:", currentPlate);
        console.log("🔢 Current index:", currentEditIndex);
        console.log("📊 Status:", res.status);
        console.log("📄 Response:", res.body);
        console.log("⏸️ Index unchanged");
        console.log("================================");

