info:
  name: 22- Edit a vehicle license plate
  type: http
  seq: 22

http:
  method: PATCH
  url: "{{Url-Dev}}services/financial/vehicles/{{id_plate_number_car}}/"
  body:
    type: json
    data: |-
      {
        "title": "شخصی",
        "plate_number": "{{edit_plate_number_car}}"
      }
  auth: inherit

