info:
  name: 22- Edit a vehicle license plate
  type: http
  seq: 22

http:
  method: PATCH
  url: "{{Url-Dev}}services/financial/vehicles/{{id_plate_number_car}}/"
  body:
    type: json
    data: |-
      {
        "title": "شخصی",
        "plate_number": "{{edit_plate_number_car}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const plates = [
          "14/ر/326/12",
          "25/ز/714/23",
          "36/ژ/481/34",
          "47/ش/953/45",
          "58/ع/267/56",
          "69/غ/835/67",
          "70/ف/192/78",
          "81/ق/546/89",
          "92/ک/378/10",
          "14/گ/629/21",
          "25/ل/843/32",
          "36/م/157/43",
          "47/ن/694/54",
          "58/و/328/65",
          "69/ه/751/76",
          "70/ی/485/87",
          "81/پ/216/98",
          "92/ت/573/19",
          "14/ث/849/20",
          "25/س/361/31",
          "36/ص/927/42",
          "47/ط/154/53",
          "58/ظ/682/64",
          "69/ع/439/75",
          "70/غ/815/86",
          "81/الف/273/97",
          "92/ب/658/18",
          "14/ج/941/29",
          "25/د/386/30",
          "36/ف/725/41",
          "47/ق/169/52",
          "58/ک/834/63",
          "69/گ/412/74",
          "70/ل/597/85",
          "81/م/246/96",
          "92/ن/781/17",
          "14/و/354/28",
          "25/ه/926/39",
          "36/ی/518/40",
          "47/پ/673/51",
          "58/ت/295/62",
          "69/ث/847/73",
          "70/س/136/84",
          "81/ص/492/95",
          "92/ط/758/16",
          "14/ظ/315/27",
          "25/ع/864/38",
          "36/غ/527/49",
          "47/الف/739/50",
          "58/ب/184/61",
          "69/ج/653/72",
          "70/د/928/83",
          "81/ف/347/94",
          "92/ق/615/15",
          "14/ک/872/26",
          "25/گ/431/37",
          "36/ل/769/48",
          "47/م/285/59",
          "58/ن/936/60",
          "69/و/542/71",
          "70/ه/817/82"
        ];

        const editIndex = Number(
          bru.getVar("edit_plate_index") || 0
        );

        if (editIndex >= plates.length) {
          throw new Error("❌ تمام پلاک‌ها استفاده شده‌اند.");
        }

        const selectedPlate = plates[editIndex];

        bru.setVar(
          "edit_plate_number_car",
          selectedPlate
        );

        console.log("🚗 Selected edit plate:", selectedPlate);
        console.log("🔢 Current index:", editIndex);
    - type: after-response
      code: |-
        // ========================================
        // Response Time
        // ========================================

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });


        // ========================================
        // Get Response Data
        // ========================================

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not valid JSON");
            return;
          }
        }


        // ========================================
        // Current Plate & Index
        // ========================================

        const editIndex = Number(
          bru.getVar("edit_plate_index") || 0
        );

        const selectedPlate = bru.getVar(
          "edit_plate_number_car"
        );


        // ========================================
        // SUCCESS - Status 200
        // ========================================

        if (res.status === 200) {

          test("Status code is 200", () => {
            expect(res.status).to.equal(200);
          });

          // Move to next plate
          bru.setVar(
            "edit_plate_index",
            String(editIndex + 1)
          );

          console.log("================================");
          console.log("✅ Plate updated successfully");
          console.log("🚗 Plate:", selectedPlate);
          console.log("🔢 Current index:", editIndex);
          console.log("➡️ Next index:", editIndex + 1);
          console.log("================================");

          return;
        }


        // ========================================
        // DUPLICATE PLATE - Status 400
        // ========================================

        if (
          res.status === 400 &&
          data.message ===
            "This vehicle plate number is already registered."
        ) {

          // Skip duplicate plate
          bru.setVar(
            "edit_plate_index",
            String(editIndex + 1)
          );

          console.log("================================");
          console.log("⚠️ Plate already registered");
          console.log("🚗 Skipped plate:", selectedPlate);
          console.log("🔢 Current index:", editIndex);
          console.log("➡️ Next index:", editIndex + 1);
          console.log("================================");

          return;
        }


        // ========================================
        // OTHER ERRORS
        // ========================================

        console.log("================================");
        console.log("❌ Plate update failed");
        console.log("🚗 Plate:", selectedPlate);
        console.log("🔢 Current index:", editIndex);
        console.log("📄 Response:", JSON.stringify(data));
        console.log("================================");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
