          "36/م/157/43",
          "47/ن/694/54",
          "58/و/328/65",
          "69/ه/751/76",
          "70/ی/485/87",
          "81/پ/216/98",
          "92/ت/573/19",
          "14/ث/849/20",
          "25/س/361/31",
          "36/ص/927/42",
          "47/ط/154/53",
          "58/ظ/682/64",
          "69/ع/439/75",
