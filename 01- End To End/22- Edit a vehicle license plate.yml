          "58/ن/936/60",
          "69/و/542/71",
          "70/ه/817/82"
        ];

        const index = Number(bru.getVar("edit_plate_index") || 0);

        if (index >= plates.length) {
          throw new Error("❌ تمام پلاک‌ها استفاده شده‌اند.");
        }

        const newPlate = plates[index];

        bru.setVar("edit_plate_number_car", newPlate);

        console.log("🚗 Selected edit plate:", newPlate);
        console.log("🔢 Index:", index);
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        const index = Number(bru.getVar("edit_plate_index") || 0);
        const plate = bru.getVar("plate_number_car");

        if (res.status === 200) {

          bru.setVar(
            "edit_plate_index",
            String(index + 1)
          );

          console.log("✅ Plate updated successfully");
          console.log("🚗 Plate:", plate);
          console.log("➡️ Next index:", index + 1);

        } else {

          console.log("❌ Plate update failed");
          console.log("🚗 Plate:", plate);
          console.log("⏸️ Index unchanged:", index);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
