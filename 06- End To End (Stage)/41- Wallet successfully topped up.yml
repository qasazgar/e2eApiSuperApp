info:
  name: 41- Wallet successfully topped up
  type: http
  seq: 41

http:
  method: GET
  url: "{{Url-Stage}}payment/payments/wallet-balance/{{User_id_wallet}}/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // ========================================
        // Validate Response
        // ========================================

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });


        // ========================================
        // Get Response Data
        // ========================================

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }


        // ========================================
        // Get Current Balance
        // ========================================

        const currentBalance = Number(
          data.data?.balance
        );

        if (isNaN(currentBalance)) {
          throw new Error("Balance not found");
        }


        // ========================================
        // Get Saved Values
        // ========================================

        const balanceBeforeTopup = Number(
          bru.getVar("balance_before_topup")
        );

        const topupAmount = Number(
          bru.getVar("topup_amount")
        );


        // ========================================
        // Validate Saved Values
        // ========================================

        if (isNaN(balanceBeforeTopup)) {
          throw new Error("balance_before_topup not found");
        }

        if (isNaN(topupAmount)) {
          throw new Error("topup_amount not found");
        }


        // ========================================
        // Validate Balance
        // ========================================

        if (
          currentBalance !==
          balanceBeforeTopup + topupAmount
        ) {

          console.log("================================");
          console.log("❌ مغایرت در موجودی کیف پول");
          console.log("💰 موجودی قبل از شارژ:", balanceBeforeTopup);
          console.log("💳 مبلغ شارژ:", topupAmount);
          console.log("📊 موجودی کل:", currentBalance);
          console.log("================================");

          throw new Error("Wallet balance mismatch");
        }


        // ========================================
        // Success
        // ========================================

        console.log("================================");
        console.log("💰 موجودی قبل از شارژ:", balanceBeforeTopup);
        console.log("💳 مبلغ شارژ:", topupAmount);
        console.log("📊 موجودی کل:", currentBalance);
        console.log(
          `✅ مبلغ ${topupAmount} ریال با موفقیت به کیف پول اضافه شد`
        );
        console.log("================================");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
