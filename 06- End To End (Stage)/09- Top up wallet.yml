info:
  name: 09- Top up wallet
  type: http
  seq: 9

http:
  method: POST
  url: "{{Url-Stage}}payment/payments/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "payment_purpose": "WALLET_TOPUP",
        "origin_service": "wallet",
        "amount": {{wallet_topup_amount}},
        "client_reference": "",
        "payment_method": "GATEWAY"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ========================================
        // Wallet Top Up Amount
        // ========================================

        let currentAmount = bru.getVar("wallet_topup_amount");

        // اگر اولین اجراست، از 10000 شروع کن
        if (!currentAmount) {
          currentAmount = 10000;
        } else {
          currentAmount = Number(currentAmount) + 10000;
        }


        // ========================================
        // Save Amount
        // ========================================

        bru.setVar(
          "wallet_topup_amount",
          String(currentAmount)
        );

        bru.setVar(
          "topup_amount",
          String(currentAmount)
        );


        // ========================================
        // Console
        // ========================================

        console.log("================================");
        console.log("💰 Wallet Top Up Amount:", currentAmount);
        console.log("💾 Top Up Amount Saved:", currentAmount);
        console.log("================================");
    - type: after-response
      code: |-
        // ========================================
        // Validate Response
        // ========================================

        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        // ========================================
        // Parse Response Body
        // ========================================

        let data = res.body;

        if (typeof data === "string") {
          try {
            data = JSON.parse(data);
          } catch (error) {
            console.log("❌ Response is not valid JSON");
            throw new Error("Invalid JSON response");
          }
        }

        // ========================================
        // Get Payment Data
        // ========================================

        const payment = data.data;

        if (!payment) {
          throw new Error("❌ Payment data not found");
        }

        // ========================================
        // Save External Payment ID
        // ========================================

        if (payment.external_payment_id) {
          bru.setVar("external_payment_id", payment.external_payment_id);

          console.log("✅ external_payment_id saved successfully");
          console.log("💳 External Payment ID:", payment.external_payment_id);
        } else {
          throw new Error("❌ external_payment_id not found");
        }

        // ========================================
        // Extract and Save Callback Payment ID
        // ========================================

        if (payment.callback_url) {
          const match = payment.callback_url.match(/\/checkout\/([^/?#]+)/);

          if (match && match[1]) {
            const callbackPaymentId = match[1];

            bru.setVar("callback_payment_id", callbackPaymentId);

            console.log("✅ callback payment ID saved successfully");
            console.log("🔗 Callback Payment ID:", callbackPaymentId);
          } else {
            throw new Error("❌ Payment ID not found in callback_url");
          }
        } else {
          throw new Error("❌ callback_url not found");
        }

        // ========================================
        // Summary
        // ========================================

        console.log("========================================");
        console.log("✅ Payment variables saved");
        console.log("💳 External Payment ID:", bru.getVar("external_payment_id"));
        console.log("🔗 Callback Payment ID:", bru.getVar("callback_payment_id"));
        console.log("========================================");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
