info:
  name: 13- Create a Payment
  type: http
  seq: 13

http:
  method: POST
  url: "{{Url-Stage}}payment/payments/"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "payment_purpose": "SERVICE_PAYMENT",
        "origin_service": "financial-service",
        "amount": {{total_amount}},
        "client_reference": "{{trace_number}}",
        "payment_method": "GATEWAY"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
