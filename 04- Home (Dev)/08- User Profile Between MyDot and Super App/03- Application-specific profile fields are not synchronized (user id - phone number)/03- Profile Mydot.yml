runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        const data = res.body;

        const userId = data.user_id;
        const phoneNumber = data.phone_number;

        if (userId && phoneNumber) {
          bru.setVar("user_id_mydot", userId);
          bru.setVar("phone_number_mydot", phoneNumber);

          console.log("✅ user id و phone number مای دات با موفقیت ذخیره شد");
          console.log("👤 user id mydot:", userId);
          console.log("📱 phone number mydot:", phoneNumber);
        } else {
          console.log("❌ user id و phone number مای دات ذخیره نشد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
