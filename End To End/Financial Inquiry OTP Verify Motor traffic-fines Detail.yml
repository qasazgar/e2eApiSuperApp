info:
  name: Financial Inquiry OTP Verify Motor traffic-fines Detail
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url-Dev}}services/financial/inquiry/otp/verify/"
  body:
    type: json
    data: |-
      { 
      "otp": "{{otp}}" 
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
