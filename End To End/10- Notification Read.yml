info:
  name: 10- Notification Read
  type: http
  seq: 10

http:
  method: POST
  url: "{{Url-Dev}}notifications/inapp/{{latest_notification_id}}/read/"
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
