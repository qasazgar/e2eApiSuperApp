info:
  name: Bills History
  type: http
  seq: 2

http:
  method: GET
  url: "{{Url-Dev}}services/financial/bills/history/"
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: type
      value: midterm_phone_bill
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: page_size
      value: "2"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
