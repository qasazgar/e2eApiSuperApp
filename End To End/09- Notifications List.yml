info:
  name: 09- Notifications List
  type: http
  seq: 9

http:
  method: GET
  url: "{{Url-Dev}}notifications/inapp/?unread_only=true"
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: unread_only
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        const latestNotificationId = data.data.results[0].id;

        bru.setVar("latest_notification_id", latestNotificationId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
