info:
  name: vehicle traffic-fines detail
  type: http
  seq: 2

http:
  method: GET
  url: "{{Url-Dev}}services/financial/inquiry/vehicle/traffic-fines/detail/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
