docs:
  content: |-
    # **SA-T388** <span><span><span>**Prevent gas bill inquiry with invalid GasBillID**</span></span></span></span>

    **Given** the user is on the Gas Bill Inquiry page \
    **And** the ParticipateCode field is empty \
    **When** the user enters an invalid GasBillID \
    **And** submits the inquiry \
    **Then** the system should validate the GasBillID \
    **And** the inquiry should be prevented \
    **And** an appropriate validation error message should be displayed
  type: text/markdown
