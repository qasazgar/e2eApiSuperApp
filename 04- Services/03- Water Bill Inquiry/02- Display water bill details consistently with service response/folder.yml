docs:
  content: |-
    # **SA-T47** <span><span><span><span><span><span><span>**Display water bill details consistently with service response**</span></span></span></span></span></span></span></span>

    **Given** the user has entered valid water bill information \
    **When** the user submits the inquiry \
    **And** the Water Bill Inquiry service returns bill details \
    **Then** the displayed bill amount should match the service response \
    **And** the displayed billing period should match the service response \
    **And** the displayed payment due date should match the service response \
    **And** other displayed bill details should match the corresponding service response fields
  type: text/markdown
