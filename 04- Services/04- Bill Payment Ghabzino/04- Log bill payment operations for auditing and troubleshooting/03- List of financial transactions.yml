runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        // ========================================
        // Parse Response
        // ========================================

        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        // ========================================
        // Check Transaction ID
        // ========================================

        const transactionId = "3effcd0c-86ca-4928-821a-ee44fd49f5e6";

        const items =
          responseData.data &&
          Array.isArray(responseData.data.items)
            ? responseData.data.items
            : [];

        const transactionExists = items.some(
          item => item.id === transactionId
        );

        // ========================================
        // Result
        // ========================================

        if (transactionExists) {
          console.log("✅ شماره تراکنش به جهت پیگیری در لیست وجود دارد");
        } else {
          console.log(
            "❌ آیتمی برای نمایش و پیگیری تراکنش در لیست وجود ندارد"
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
