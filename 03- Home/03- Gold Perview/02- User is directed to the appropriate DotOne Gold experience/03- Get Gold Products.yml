info:
  name: 03- Get Gold Products
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url_dotone_gold}}products/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: fa
    - name: origin
      value: https://dotone.gold
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotone.gold/
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 1000ms", () => {
          expect(res.responseTime).to.be.below(1000);
        });

        const data = res.body;

        if (Array.isArray(data) && data.length > 0) {
          console.log(
            "✅ کاربر با موفقیت به https://dotone.gold/ منتقل شد"
          );
        } else {
          console.log(
            "❌ کاربر به https://dotone.gold/ منتقل نشد"
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
