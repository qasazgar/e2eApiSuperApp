runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        const results = data.data.results;

        const blockchainExists = results.some(item =>
          item.title === "دات نما" &&
          item.title_en === "dot nama"
        );

        test("Blockchain icon exists on Home", () => {
          if (blockchainExists) {
            console.log("✅ آیکون Dotnama در صفحه Home وجود دارد");
          } else {
            console.log("❌ آیکون Gold در صفحه Home یافت نشد");
          }

          expect(blockchainExists).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
