info:
  name: 04- Send Otp
  type: http
  seq: 4

http:
  method: POST
  url: "{{Url-Dev-mydot}}auth/superapp/login/"
  body:
    type: json
    data: |-
      {
        "phone_number": "{{phone_number}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 202", () => {
          expect(res.status).to.equal(202);
        });

        test("Response time is less than 1000ms", () => {
          expect(res.responseTime).to.be.below(1000);
        });

        const body = res.getBody();

        bru.setVar("pre_auth_token", body.pre_auth_token);
        bru.setVar("mfa_method", body.mfa_method);
        bru.setVar("otp", body.otp);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
