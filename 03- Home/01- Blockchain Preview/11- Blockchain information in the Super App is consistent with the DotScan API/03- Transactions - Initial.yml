info:
  name: 03- Transactions - Initial
  type: http
  seq: 3

http:
  method: GET
  url: "{{Url_dotscan}}api/v2/main-page/transactions"
  headers:
    - name: accept
      value: "*/*"
    - name: accept-language
      value: en-US,en;q=0.9,fa-IR;q=0.8,fa;q=0.7
    - name: Cookie
      value: chakra-ui-color-mode=dark; chakra-ui-color-theme=dark; address_format=base16; uuid=d855e5df-531c-49d3-b49d-b645f41084a2; indexing_alert=false; _ga=GA1.1.506181953.1787483130; _dd_s=logs=1&id=dc6ba713-49b7-4ee8-9aa0-1db57d1fed8b&created=1788253681886&expire=1788254581886; _ga_R6ESK4ET4E=GS2.1.s1788253681$o9$g0$t1788253697$j44$l0$h0
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotscan.one/
    - name: sec-ch-ua
      value: '"Not=A?Brand";v="99", "Google Chrome";v="151", "Chromium";v="151"'
    - name: sec-ch-ua-mobile
      value: ?1
    - name: sec-ch-ua-platform
      value: '"iOS"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-origin
    - name: user-agent
      value: Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 1000ms", () => {
          expect(res.responseTime).to.be.below(1000);
        });

        const data = res.body;

        // ذخیره کل Response API سوم
        bru.setVar("api3_initial", JSON.stringify(data));

        console.log("✅ اطلاعات api transactions از https://dotscan.one/ ذخیره شد");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
