    # <span>**Transaction trend handles a period with no transaction data**</span>

    **Given** the user has opened the Blockchain Explorer \
    **And** no transaction data is available for the configured time period \
    **When** the transaction trend is loaded \
    **Then** an appropriate empty state should be displayed \
    **And** the user should understand that no transaction data is currently available
