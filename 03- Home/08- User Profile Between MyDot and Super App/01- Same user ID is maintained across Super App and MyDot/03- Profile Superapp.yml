runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        const data = res.body;

        if (
          res.status === 200 &&
          data.success === true &&
          data.data?.user
        ) {
          const userId = data.data.user;

          bru.setVar("user_id_superapp", userId);

          console.log("✅ user id superapp با موفقیت ذخیره شد");
          console.log("👤 user id superapp:", userId);

        } else {
          console.log("❌ user id superapp وجود ندارد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
