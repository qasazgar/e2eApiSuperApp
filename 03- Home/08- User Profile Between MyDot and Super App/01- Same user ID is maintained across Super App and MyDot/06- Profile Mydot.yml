runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        const data = res.body;

        const userIdSuperApp = bru.getVar("user_id_superapp");
        const userIdMyDot = data.user_id;

        if (
          userIdSuperApp &&
          userIdMyDot &&
          userIdSuperApp === userIdMyDot
        ) {

          console.log(
            "✅ user id superapp با user id mydot یکسان میباشد"
          );

        } else {

          console.log(
            "❌ user id superapp با user id mydot یکسان نیست"
          );

        }

        console.log("👤 user id superapp:", userIdSuperApp);
        console.log("👤 user id mydot:", userIdMyDot);

        test("User ID Super App and MyDot should be the same", () => {
          expect(userIdMyDot).to.equal(userIdSuperApp);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
