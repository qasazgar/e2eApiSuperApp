runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        if (res.status === 200) {

          console.log(
            "✅ شما با موفقیت به صفحه Home مای دات بدون نیاز به لاگین منتقل شدید"
          );

        } else {

          console.log(
            "❌ شما به صفحه مای دات منتقل نشدید"
          );

        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
