runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        const data = res.body;

        const userIdSuperApp = data.data?.user;
        const phoneNumberSuperApp = data.data?.phone_number;

        const userIdMyDot = bru.getVar("user_id_mydot");
        const phoneNumberMyDot = bru.getVar("phone_number_mydot");

        // تبدیل شماره به فرمت یکسان
        const normalizePhoneNumber = (phone) => {
          if (!phone) return null;

          phone = String(phone).trim();

          if (phone.startsWith("+98")) {
            return "0" + phone.substring(3);
          }

          if (phone.startsWith("98")) {
            return "0" + phone.substring(2);
          }

          return phone;
        };

        const normalizedPhoneSuperApp =
          normalizePhoneNumber(phoneNumberSuperApp);

        const normalizedPhoneMyDot =
          normalizePhoneNumber(phoneNumberMyDot);

        if (
          userIdSuperApp &&
          userIdMyDot &&
          normalizedPhoneSuperApp &&
          normalizedPhoneMyDot &&
          userIdSuperApp === userIdMyDot &&
          normalizedPhoneSuperApp === normalizedPhoneMyDot
        ) {
          console.log(
            "✅ user id با phone number در مای دات و سوپراپ یکسان میباشد"
          );
        } else {
          console.log(
            "❌ user id با phone number در مای دات و سوپراپ یکسان نمیباشد"
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
