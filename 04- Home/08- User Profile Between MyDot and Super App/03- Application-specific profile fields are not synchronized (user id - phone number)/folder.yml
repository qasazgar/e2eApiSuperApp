    # <span>**SA-T353** **Application-specific profile fields are not synchronized**</span>

    **Given** the user has an application-specific profile field in MyDot \
    **When** the user updates the application-specific field \
    **Then** the field should remain specific to MyDot \
    **And** it should not be changed in the Super App
